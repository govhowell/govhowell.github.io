name: Deploy Governor Howell Site to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Hugo
        # SECURITY: Pinned to full commit SHA for supply-chain security.
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f  # v3.0.0
        with:
          hugo-version: '0.155.2'  # pinned — do not change to 'latest'
          extended: true           # required for SCSS processing (parchment skin)

      - name: Build site
        run: hugo --minify --gc

      - name: Deploy to gh-pages branch
        # SECURITY: Pinned to full commit SHA for supply-chain security.
        # ACCEPTED RISK: permissions: contents: write is required for this action to push.
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e  # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages  # source stays on main; built output goes here
          force_orphan: true        # gh-pages contains only the built site, no history
          keep_files: false
          cname: govhowell.org
