{{- $user := .Get "user" -}}
{{- $domain := .Get "domain" -}}
{{- $label := .Get "label" | default "Send us a message" -}}
{{- $id := printf "email-%s" (substr (md5 (printf "%s@%s" $user $domain)) 0 8) -}}
<span id="{{ $id }}" class="obfuscated-email">
  <noscript>Enable JavaScript to see the email address.</noscript>
</span>
<script>
(function() {
  var u = '{{ $user }}';
  var d = '{{ $domain }}';
  var l = '{{ $label }}';
  var el = document.getElementById('{{ $id }}');
  if (el) {
    var a = document.createElement('a');
    a.href = 'mai' + 'lto:' + u + '@' + d;
    a.textContent = l;
    a.className = 'email-link';
    el.innerHTML = '';
    el.appendChild(a);
  }
})();
</script>
