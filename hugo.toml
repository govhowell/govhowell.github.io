baseURL = 'https://govhowell.org/'
languageCode = 'en-us'
title = 'Governor Richard Howell'
theme = 'hugo-book'

enableRobotsTXT = true
enableGitInfo = false

[params]
  description = "Richard Howell (1754–1802) — Patriot, Soldier, Governor of New Jersey"
  author = "Governor Howell Project"

  # Hugo Book settings
  BookTheme = 'light'
  BookToC = true
  BookSearch = true
  BookCollapseSection = true
  BookComments = false
  BookPortableLinks = false
  BookRepo = ''

[taxonomies]
  period = "periods"
  person = "people"
  event = "events"
  tag = "tags"

[menu]
  [[menu.before]]
    name = "Biography"
    url = "/biography/"
    weight = 1
  [[menu.before]]
    name = "Timelines"
    url = "/timelines/"
    weight = 2
  [[menu.before]]
    name = "Letters"
    url = "/letters/"
    weight = 3
  [[menu.before]]
    name = "Events"
    url = "/events/"
    weight = 4
  [[menu.before]]
    name = "People"
    url = "/people/"
    weight = 5
  [[menu.before]]
    name = "Family"
    url = "/family/"
